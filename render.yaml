services:
  - type: web
    name: mental-health-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir Calma-app api_rest:app --bind 0.0.0.0:$PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
