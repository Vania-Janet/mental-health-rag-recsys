services:
  - type: web
    name: mental-health-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd Calma-app && gunicorn api_rest:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: /opt/render/project/src/Calma-app
    healthCheckPath: /health
